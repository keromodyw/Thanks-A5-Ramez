<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f3e9d9" />
<title>رسالة</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "Segoe UI", "Cairo", Tahoma, sans-serif;
    background: linear-gradient(160deg, #fbf5ea 0%, #f2e8d8 58%, #e8ddcc 100%) fixed;
    color: #4a3628;
    text-align: center;
  }

  .coming {
    max-width: 460px;
    width: 100%;
    background: linear-gradient(180deg, #fffdf6, #f7efdf);
    border: 1px solid rgba(150, 110, 70, .18);
    border-radius: 22px;
    padding: 48px 30px 42px;
    box-shadow: 0 22px 55px rgba(96, 66, 40, .22);
  }

  .timer {
    width: 84px;
    height: 84px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #835f3f, #6b4a32);
    color: #fdf6e9;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 26px rgba(90, 62, 35, .35);
    animation: pulse 2s ease-in-out infinite;
  }
  .timer svg { width: 44px; height: 44px; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .line {
    font-size: 1.25rem;
    font-weight: 800;
    line-height: 1.9;
  }

  .emoji {
    margin-top: 22px;
    font-size: 2rem;
    letter-spacing: .5em;
    text-indent: .5em;
  }

  @media (prefers-reduced-motion: reduce) {
    .timer { animation: none; }
  }
</style>
</head>
<body>
  <div class="coming">
    <div class="timer" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="13" r="8.2" stroke="currentColor" stroke-width="2"/>
        <path d="M12 9v4.2l2.8 1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M9 2.5h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="line">استناني يا اخ رامز بس<br>اروح و ارفع صورة القعدة و هبعت لحضرتك</p>
    <p class="emoji">😂😂</p>
  </div>
</body>
</html>
