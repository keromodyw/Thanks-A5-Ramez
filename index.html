<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f3e9d9" />
<title>رسالة</title>
<style>
  :root {
    --env: #fdfaf2;
    --env-light: #fffdf7;
    --env-shade: #e8e0cd;
    --strip: #d8c9a6;
    --strip-dark: #b7a27a;
    --ink: #4a3628;
    --ink-soft: #7d6a52;
    --coffee: #6b4a32;
    --coffee-2: #835f3f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    min-height: 100dvh;
    font-family: "Segoe UI", "Cairo", Tahoma, sans-serif;
    background: linear-gradient(160deg, #fbf5ea 0%, #f2e8d8 58%, #e8ddcc 100%) fixed;
    color: var(--ink);
    overflow-x: hidden;
    overscroll-behavior-y: none;
    user-select: none;
  }

  .stage {
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 34px 20px 44px;
  }

  .env-cover {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    margin: auto;
    transition: opacity .6s ease, transform .7s cubic-bezier(.4, 0, .2, 1);
  }
  .stage.hidden .env-cover {
    opacity: 0;
    transform: translateY(-64px) scale(.94);
  }

  .env {
    width: min(88vw, 350px);
    aspect-ratio: 300 / 188;
    position: relative;
    border-radius: 12px;
    background: linear-gradient(160deg, var(--env-light), var(--env));
    box-shadow: 0 26px 60px rgba(96, 66, 40, .25);
    border: 1px solid rgba(150, 110, 70, .14);
    cursor: pointer;
    perspective: 900px;
    transition: transform .12s ease;
    touch-action: manipulation;
  }

  .env.ready:hover { transform: translateY(-4px); }
  .env.press { transform: scale(.975); }
  .env.torn { cursor: default; }

  .env.shake { animation: envShake .38s ease; }
  @keyframes envShake {
    0%, 100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-3px) rotate(-.4deg); }
    40% { transform: translateX(3px) rotate(.4deg); }
    60% { transform: translateX(-2px) rotate(-.2deg); }
    80% { transform: translateX(2px) rotate(.2deg); }
  }

  .env-lid {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 34%;
    z-index: 2;
    transform-origin: top center;
    background: linear-gradient(180deg, #fffdf6, #ebe3cf);
    border-radius: 12px 12px 0 0;
    box-shadow: 0 4px 12px rgba(96, 66, 40, .12);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 93.75% 44%, 87.5% 100%, 81.25% 44%, 75% 100%, 68.75% 44%, 62.5% 100%, 56.25% 44%, 50% 100%, 43.75% 44%, 37.5% 100%, 31.25% 44%, 25% 100%, 18.75% 44%, 12.5% 100%, 6.25% 44%, 0 100%);
    transform: rotateX(0deg);
    opacity: 0;
    transition: transform .55s cubic-bezier(.34, 1.3, .5, 1);
  }
  .env.torn .env-lid {
    animation: lidFlash .3s ease forwards;
    transform: rotateX(-150deg);
  }
  @keyframes lidFlash {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  .env-face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    z-index: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 9%;
  }
  .env-face::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, transparent 49.4%, rgba(150, 120, 80, .22) 50%, transparent 50.6%) 0 0 / 58% 100% no-repeat,
      linear-gradient(45deg, transparent 49.4%, rgba(150, 120, 80, .22) 50%, transparent 50.6%) 100% 0 / 58% 100% no-repeat;
  }
  .env-face::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255, 255, 255, .4), rgba(160, 130, 90, .06) 55%, transparent 70%);
  }

  .thanks {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(1.5rem, 7vw, 2rem);
    font-weight: 700;
    color: var(--ink);
    letter-spacing: .03em;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .45);
    position: relative;
    z-index: 1;
  }
  .to {
    margin-top: 7px;
    font-size: clamp(.78rem, 3.4vw, .98rem);
    font-weight: 700;
    color: var(--ink-soft);
    letter-spacing: .08em;
    position: relative;
    z-index: 1;
  }

  .strip {
    position: absolute;
    top: 34%;
    left: 2%;
    right: 2%;
    height: 42px;
    z-index: 5;
    background:
      repeating-linear-gradient(45deg, rgba(255, 255, 255, .14) 0 6px, transparent 6px 12px),
      linear-gradient(180deg, var(--strip), var(--strip-dark));
    border-radius: 6px;
    box-shadow: 0 3px 8px rgba(96, 66, 40, .2);
    opacity: 0;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 93.75% 46%, 87.5% 100%, 81.25% 46%, 75% 100%, 68.75% 46%, 62.5% 100%, 56.25% 46%, 50% 100%, 43.75% 46%, 37.5% 100%, 31.25% 46%, 25% 100%, 18.75% 46%, 12.5% 100%, 6.25% 46%, 0 100%);
  }
  .env.torn .strip {
    animation: stripTear .55s cubic-bezier(.4, 0, 1, .7) forwards;
  }
  @keyframes stripTear {
    0% { opacity: 0; transform: translateY(0) rotate(0); }
    16% { opacity: 1; transform: translateY(-8%) rotate(1.5deg); }
    100% { opacity: 0; transform: translateY(-170%) rotate(8deg); }
  }

  .hint {
    margin-top: 26px;
    font-size: clamp(.92rem, 4vw, 1.05rem);
    color: var(--ink-soft);
    background: rgba(255, 255, 255, .5);
    border: 1px solid rgba(150, 110, 70, .16);
    padding: 9px 20px;
    border-radius: 40px;
    pointer-events: none;
    transition: opacity .5s ease, transform .5s ease;
  }
  .stage.hidden .hint { opacity: 0; transform: translateY(24px); }

  .letter-card {
    width: min(94vw, 520px);
    background:
      linear-gradient(rgba(150, 110, 70, .045) 1px, transparent 1px) 0 0 / 100% 30px,
      linear-gradient(180deg, #fffdf6, #f7efdf);
    border: 1px solid rgba(150, 110, 70, .18);
    border-radius: 18px;
    padding: 26px 22px 30px;
    box-shadow: 0 22px 55px rgba(96, 66, 40, .22);
    margin: auto;
    opacity: 0;
    transform: translateY(120px) scale(.92);
    transition: opacity .65s ease, transform .85s cubic-bezier(.22, 1.1, .35, 1);
  }
  .letter-card.show { opacity: 1; transform: translateY(0) scale(1); }

  .letter-card > * { opacity: 0; transform: translateY(16px); }
  .letter-card.show > * {
    opacity: 1;
    transform: translateY(0);
    transition: opacity .6s ease, transform .65s cubic-bezier(.3, 1.3, .42, 1);
  }
  .letter-card.show .photo-frame { transition-delay: .12s; }
  .letter-card.show .letter-text { transition-delay: .28s; }
  .letter-card.show .signature { transition-delay: .42s; }
  .letter-card.show .audio-card { transition-delay: .54s; }

  .photo-frame {
    width: 58%;
    max-width: 220px;
    aspect-ratio: 1 / 1.15;
    margin: 0 auto 22px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 12px 28px rgba(96, 66, 40, .3);
    border: 4px solid #fdf9ef;
    outline: 1px solid rgba(150, 110, 70, .28);
    transform: rotate(-1.6deg);
    background: linear-gradient(135deg, #ead6b4, #dcc194);
  }
  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-ph {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .photo-ph.heart::before {
    content: "♥";
    font-size: 2.8rem;
    color: #a97f58;
  }

  .letter-text {
    font-size: clamp(.98rem, 4.2vw, 1.12rem);
    line-height: 2.1;
    white-space: pre-line;
    text-align: right;
    color: var(--ink);
  }

  .signature {
    margin-top: 16px;
    font-size: 1rem;
    font-weight: 800;
    color: var(--coffee);
  }

  .audio-card {
    margin-top: 26px;
    background: linear-gradient(180deg, #fffdf7, #f6eddc);
    border: 1px solid rgba(150, 110, 70, .22);
    border-radius: 16px;
    padding: 16px 16px 14px;
  }
  .audio-card .audio-label {
    font-size: .92rem;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }
  .play-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border: none;
    border-radius: 44px;
    padding: 14px 16px;
    font-size: 1.02rem;
    font-weight: 800;
    color: #fdf6e9;
    font-family: inherit;
    background: linear-gradient(135deg, var(--coffee-2), var(--coffee));
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(90, 62, 35, .32);
    transition: transform .2s ease, box-shadow .25s ease, filter .2s ease;
    touch-action: manipulation;
    width: 100%;
  }
  .play-btn:hover { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(90,62,35,.4); filter: brightness(1.07); }
  .play-btn:active { transform: translateY(0) scale(.97); }

  .eq {
    display: inline-flex;
    align-items: flex-end;
    gap: 3px;
    height: 20px;
    flex: 0 0 auto;
  }
  .eq span {
    width: 4px;
    border-radius: 3px;
    background: currentColor;
    height: 100%;
    transform-origin: bottom;
  }
  .eq.playing span { animation: eqBar .9s ease-in-out infinite; }
  .eq.playing span:nth-child(1) { animation-delay: 0s; }
  .eq.playing span:nth-child(2) { animation-delay: .18s; }
  .eq.playing span:nth-child(3) { animation-delay: .36s; }
  .eq.playing span:nth-child(4) { animation-delay: .54s; }
  @keyframes eqBar {
    0%, 100% { transform: scaleY(.3); }
    50% { transform: scaleY(1); }
  }

  .audio-note {
    margin-top: 12px;
    font-size: .82rem;
    color: var(--ink-soft);
    display: none;
  }

  audio { display: none; }
</style>
</head>
<body>

  <div class="stage" id="stage">
    <div class="env-cover" id="cover">
      <div class="env" id="env">
        <div class="env-face">
          <span class="thanks">THANK YOU!</span>
          <span class="to">To: A5 Ramez Eskander</span>
        </div>
        <div class="strip"></div>
        <div class="env-lid"></div>
      </div>
      <p class="hint">دوس على الظرف عشان تفتحه</p>
    </div>

    <div class="letter-card" id="card">
      <div class="photo-frame" id="photoFrame">
        <img id="photo" src="photo/photo.jpg" alt="صورة" onerror="swapPhoto()" />
      </div>
      <p class="letter-text" id="letterText">حط كلامك هنا...
اكتب رسالتك زي ما تحب، والصورة والفويس نوت هيظهروا هنا.</p>
      <p class="signature" id="signature">من: إسمك ❤</p>
      <div class="audio-card">
        <p class="audio-label">بصيتك وصلت، استمع:</p>
        <button class="play-btn" id="playBtn">
          <span class="eq" id="eq"><span></span><span></span><span></span><span></span></span>
          <span id="playLabel">استمع للفويس نوت</span>
        </button>
        <audio id="voice" src="audio/voice-note.mp3" preload="auto"></audio>
        <div class="audio-note" id="audioNote">مش لاقي ملف الصوت — حط الفويس نوت في مجلد audio باسم voice-note.mp3</div>
      </div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
